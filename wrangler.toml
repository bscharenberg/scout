name = "scout"
main = "worker/index.js"
compatibility_date = "2026-05-15"

# Bundle the prompt and the BTO playbook (.md files) as plain text the worker can import.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# Per-IP limit: 10 requests a minute in each Cloudflare location.
# namespace_id must be unique in the Cloudflare account. Change it if another worker already uses 1001.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

[observability]
enabled = true

# ANTHROPIC_API_KEY is a secret already set on the deployed worker.
# For local testing, put it in .dev.vars (ignored by git), never in this file.
